name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name black --org com.calender

      - name: Apply Android app identity and launcher icon
        run: |
          sed -i 's/android:label="[^"]*"/android:label="التقويم"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/calendar_icon"#' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp assets/calendar_icon_xxxhdpi.png android/app/src/main/res/drawable/calendar_icon.png
          printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties

      - name: Normalize analyzer configuration
        run: rm -f analysis_options.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Android identity, launcher icon, package, and no Internet permission
        run: |
          grep -q 'android:label="التقويم"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/calendar_icon"' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/calendar_icon.png
          test -f assets/app_icon/app_icon.svg
          grep -q 'fill="#000000"' assets/app_icon/app_icon.svg
          grep -q 'fill="#FFFFFF"' assets/app_icon/app_icon.svg
          grep -R 'com.calender.black' android/app/src/main
          if grep -R "android.permission.INTERNET" android/app/src/main; then
            echo "Internet permission found in the release/main Android source."
            exit 1
          fi

      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK architecture
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Non-arm64 ABI detected in APK."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: offline-black-calendar-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Send successful APK to Telegram
        if: ${{ success() }}
        env:
          HYOUKA_BUILD_WEBHOOK: https://hyouka-http-mcp.vercel.app/api/telegram-build
          GITHUB_ACTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {"owner":"${{ github.repository_owner }}","repo":"${{ github.event.repository.name }}","runId":${{ github.run_id }},"artifactName":"offline-black-calendar-apk-arm64-v8a","sha":"${{ github.sha }}"}
          JSON
          )
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GITHUB_ACTION_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$HYOUKA_BUILD_WEBHOOK"
            then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
